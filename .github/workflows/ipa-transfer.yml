name: Temporary IPA transfer

on:
  push:
    branches:
      - ipa-transfer-temp

permissions:
  contents: write

jobs:
  transfer:
    if: github.event.head_commit.message != 'Store verified IPA [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify IPA
        shell: bash
        run: |
          curl --fail --location --silent --show-error 'https://tempfile.org/rJt8vL9Dabr/download' -o UltimateSkyBlockMarket.ipa
          echo 'dcd1395764b08996f61fd191e914fe433cb4b9e80c1030edfeaa64e2fdb3aeff  UltimateSkyBlockMarket.ipa' | sha256sum -c -
          unzip -t UltimateSkyBlockMarket.ipa >/dev/null
      - name: Commit verified IPA temporarily
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f UltimateSkyBlockMarket.ipa
          git commit -m 'Store verified IPA [skip ci]'
          git push origin HEAD:ipa-transfer-temp
